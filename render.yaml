# Render deploy config for the Invoice Manager.
# env: docker (not python) - WeasyPrint's system libraries (Pango/Cairo) can
# only be installed via the Dockerfile; Render's native Python environment
# ignores apt.txt, and the old native config therefore could not run PDFs.
services:
  - type: web
    name: invoice-manager
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
